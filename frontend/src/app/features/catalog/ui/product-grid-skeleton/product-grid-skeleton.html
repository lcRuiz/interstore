<ul class="grid" data-testid="skeleton" aria-hidden="true">
  @for (card of cards(); track card) {
    <li class="card" data-testid="skeleton-card">
      <span class="block media"></span>
      <span class="block line line--name"></span>
      <span class="block line line--category"></span>
      <span class="block line line--price"></span>
    </li>
  }
</ul>
