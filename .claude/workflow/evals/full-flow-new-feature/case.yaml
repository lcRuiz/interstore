schema_version: "1.1"
name: full-flow-new-feature
expected_outcome: |
  El agente detecta el entorno, crea .workflow/<feature>/state.md y recorre las cuatro fases en orden: matriz y specs en rojo por aserción (reporte RED real), implementación hasta verde con la suite completa, lint y build en verde, documentación en docs/features, auditoría OWASP Top 10:2025 solo del diff con veredicto, commits Conventional Commits atómicos, y se detiene en la puerta humana antes de git push / gh pr create.
